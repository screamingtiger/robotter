[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robotter"
version = "0.1.0"
description = "Safe, modular tank-drive control for Ardy"
requires-python = ">=3.11"

[project.optional-dependencies]
rt = ["arduino-router-bridge"]
benchmark = ["onnxruntime==1.30.0"]

[project.scripts]
robotter = "robotter.cli:main"
robotter-rt = "robotter.rt_cli:main"
robotter-gps = "robotter.gps_logger:main"

[tool.setuptools]
packages = ["robotter"]
